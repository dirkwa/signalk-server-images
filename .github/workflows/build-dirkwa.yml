name: build-dirkwa

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the PR stack is unchanged (e.g. Dockerfile-only changes)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: build-dirkwa
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/signalk-server
  UPSTREAM: SignalK/signalk-server
  PRS: "2524 2895 2842 2844 2908 2909 2910 2911 3041 3124 3120"
  # Branches merged into the stack AFTER the PRs, for changes that have no
  # upstream PR (yet). Space-separated "owner/repo:branch" specs. Each
  # branch's head SHA feeds the composite state key, so pushing to the
  # branch — or adding/removing one here — triggers a rebuild.
  # skip-webapp-swap carries upstream PR #2931 (KIP -> Skip webapp) plus a
  # pre-merge of #2588, whose optionalDependencies additions sit on the lines
  # #2931 removes. Merging the PR directly would conflict; this branch has the
  # resolution baked in, so it stacks cleanly here. Drop it once #2931 merges.
  BRANCHES: "dirkwa/signalk-server:n2k-wasm-integration dirkwa/signalk-server:skip-webapp-swap"
  # Build the Rust canboat binary from upstream master: every dirkwa
  # canboat PR (#799 #800 #801 #807) is merged there, but no release tag
  # ships the binary yet. The ref's head SHA feeds the composite key, so
  # upstream commits rebuild. Switch CANBOAT_SOURCE to "release" (and
  # update the pinned sha256s) once a release with the binary exists.
  # The native canboat binary is no longer baked in: the wasm build of
  # the same code decodes/encodes in-process (see CANBOAT_WASM below),
  # and canbus keeps canboatjs's canSocket shim as its frame mover.
  # hasAnalyzer-gated native subtypes disappear from the UI; set "1"
  # (and restore the canboat composite entry) to bring them back.
  INSTALL_CANBOAT: "0"
  CANBOAT_SOURCE: "git"
  CANBOAT_REPO: "canboat/canboat"
  CANBOAT_REF: "master"
  # @canboat/wasm from npm. It ships a prebuilt .wasm and has no install
  # script, so the image just installs the published tarball -- no Rust
  # toolchain on the runner. Empty disables the install.
  #
  # A semver RANGE, resolved to a concrete version in the prepare job.
  # The resolved version is what feeds the composite key and the build
  # arg, so a new canboat-wasm release moves the key on its own and the
  # next scheduled run rebuilds -- exactly how PRS/BRANCHES track their
  # upstreams. Putting the range itself in the key would freeze it: the
  # string never changes, so a new release would never trigger a build.
  CANBOAT_WASM_RANGE: "^8.0.0"
  # Unreleased @signalk/n2k-signalk to bake into the image (SignalK/
  # n2k-signalk#339: canName packed directly from the claim fields, no
  # canboatjs at runtime). The tarball is pre-built on the runner and
  # staged as signalk-src/extra-packages/ for the Dockerfile — see the
  # extra-packages note there for why not a git: override. The ref's
  # head SHA feeds the composite key. Empty N2K_SIGNALK_REPO disables
  # the override (do that when the PR is merged and released).
  N2K_SIGNALK_REPO: "dirkwa/n2k-signalk"
  N2K_SIGNALK_REF: "dirkwa-staging"
  # Freeboard-SK built from a branch that combines the open upstream
  # Freeboard PRs (#904 radar CPA line, #914 sensor targets), installed in
  # place of the released Freeboard the server depends on. The tarball is
  # packed on the runner (prepack runs build:all) and staged as
  # extra-packages/, so npm resolves the server's @signalk/freeboard-sk
  # dependency to it. The branch head SHA feeds the composite key. Empty
  # FREEBOARD_REPO falls back to the released Freeboard.
  FREEBOARD_REPO: "dirkwa/freeboard-sk"
  FREEBOARD_REF: "feat/collision-targets-combined"
  # Open plugin PRs bundled into the image, as space-separated
  # "owner/repo#number" specs. Each PR head is packed on the runner,
  # moved into the nested plugin tree (BUNDLE_PLUGINS) and has its App
  # Store update greyed out, so a published release cannot shadow the PR
  # build. A merged PR is skipped with a warning; install the released
  # plugin from the App Store then, and drop it from this list.
  PLUGIN_PRS: "MarineYachtRadar/mayara-server-signalk-plugin#138 dirkwa/signalk-collision-alerts#11 dirkwa/signalk-target-fusion#1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Read-only: this job runs npm install and build scripts from unreleased
    # branches (n2k-signalk, Freeboard, plugin PRs), so it must not hold a
    # token that can push to this repo or publish images.
    permissions:
      contents: read
    outputs:
      composite: ${{ steps.shas.outputs.composite }}
      master_sha: ${{ steps.shas.outputs.master_sha }}
      prs: ${{ steps.shas.outputs.prs }}
      branches: ${{ steps.shas.outputs.branches }}
      canboat_desc: ${{ steps.shas.outputs.canboat_desc }}
      canboat_sha: ${{ steps.shas.outputs.canboat_sha }}
      n2k_desc: ${{ steps.shas.outputs.n2k_desc }}
      freeboard_desc: ${{ steps.shas.outputs.freeboard_desc }}
      plugin_prs_desc: ${{ steps.shas.outputs.plugin_prs_desc }}
      bundle_plugins: ${{ steps.plugins.outputs.bundle_plugins }}
      plugins_with_update_disabled: ${{ steps.plugins.outputs.plugins_with_update_disabled }}
      wasm_desc: ${{ steps.shas.outputs.wasm_desc }}
      wasm_version: ${{ steps.shas.outputs.wasm_version }}
      changed: ${{ steps.gate.outputs.changed }}
      combined_sha: ${{ steps.stack.outputs.combined_sha }}
      combined_short: ${{ steps.stack.outputs.combined_short }}
      version: ${{ steps.stack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve upstream master + PR SHAs
        id: shas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MASTER_SHA=$(gh api repos/${{ env.UPSTREAM }}/commits/master --jq .sha)
          composite="master:$MASTER_SHA"
          prs=""
          active_prs=""
          for pr in ${{ env.PRS }}; do
            read -r pr_sha merged <<< "$(gh api repos/${{ env.UPSTREAM }}/pulls/$pr --jq '.head.sha + " " + (.merged|tostring)')"
            # A merged PR's branch conflicts with the master that now contains
            # it (add/add on its own files), so drop it from the stack instead
            # of failing every scheduled run until PRS is edited by hand.
            if [ "$merged" = "true" ]; then
              echo "::warning::PR #$pr is merged upstream - skipping it; remove it from PRS in build-dirkwa.yml."
              continue
            fi
            composite="$composite pr$pr:$pr_sha"
            prs="$prs $pr:${pr_sha:0:7}"
            active_prs="$active_prs $pr"
          done
          echo "active_prs=${active_prs# }" >> "$GITHUB_OUTPUT"
          branches=""
          for spec in ${{ env.BRANCHES }}; do
            repo=${spec%%:*}; branch=${spec#*:}
            br_sha=$(gh api "repos/$repo/commits/$branch" --jq .sha)
            composite="$composite $spec:$br_sha"
            branches="$branches $spec:${br_sha:0:7}"
          done
          if [ -n "${{ env.N2K_SIGNALK_REPO }}" ]; then
            n2k_sha=$(gh api "repos/${{ env.N2K_SIGNALK_REPO }}/commits/${{ env.N2K_SIGNALK_REF }}" --jq .sha)
            composite="$composite n2k-signalk:${{ env.N2K_SIGNALK_REPO }}:${{ env.N2K_SIGNALK_REF }}:$n2k_sha"
            echo "n2k_desc=git:${{ env.N2K_SIGNALK_REPO }}@${n2k_sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "n2k_sha=$n2k_sha" >> "$GITHUB_OUTPUT"
          else
            echo "n2k_desc=" >> "$GITHUB_OUTPUT"
            echo "n2k_sha=" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ env.FREEBOARD_REPO }}" ]; then
            fb_sha=$(gh api "repos/${{ env.FREEBOARD_REPO }}/commits/${{ env.FREEBOARD_REF }}" --jq .sha)
            composite="$composite freeboard:${{ env.FREEBOARD_REPO }}:${{ env.FREEBOARD_REF }}:$fb_sha"
            echo "freeboard_desc=git:${{ env.FREEBOARD_REPO }}@${fb_sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "freeboard_sha=$fb_sha" >> "$GITHUB_OUTPUT"
          else
            echo "freeboard_desc=" >> "$GITHUB_OUTPUT"
            echo "freeboard_sha=" >> "$GITHUB_OUTPUT"
          fi
          plugin_prs=""
          plugin_prs_desc=""
          for spec in ${{ env.PLUGIN_PRS }}; do
            repo=${spec%%#*}; num=${spec#*#}
            read -r pl_sha merged <<< "$(gh api "repos/$repo/pulls/$num" --jq '.head.sha + " " + (.merged|tostring)')"
            if [ "$merged" = "true" ]; then
              echo "::warning::Plugin PR $spec is merged - skipping it; install the release from the App Store and remove it from PLUGIN_PRS."
              continue
            fi
            composite="$composite plugin:$spec:$pl_sha"
            plugin_prs="$plugin_prs $repo@$pl_sha"
            plugin_prs_desc="$plugin_prs_desc $spec:${pl_sha:0:7}"
          done
          echo "plugin_prs=${plugin_prs# }" >> "$GITHUB_OUTPUT"
          echo "plugin_prs_desc=${plugin_prs_desc# }" >> "$GITHUB_OUTPUT"
          if [ -n "${{ env.CANBOAT_WASM_RANGE }}" ]; then
            # Resolve the range to the highest published match. npm view
            # prints one version for a single match and a JSON array for
            # several, so normalise and take the last (npm sorts ascending).
            wasm_version=$(npm view "@canboat/wasm@${{ env.CANBOAT_WASM_RANGE }}" version --json \
              | jq -r 'if type == "array" then .[-1] else . end')
            case "$wasm_version" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::could not resolve @canboat/wasm@${{ env.CANBOAT_WASM_RANGE }} (got '$wasm_version')"; exit 1 ;;
            esac
            composite="$composite canboat-wasm:npm:$wasm_version"
            echo "wasm_desc=npm:$wasm_version" >> "$GITHUB_OUTPUT"
            echo "wasm_version=$wasm_version" >> "$GITHUB_OUTPUT"
          else
            echo "wasm_desc=" >> "$GITHUB_OUTPUT"
            echo "wasm_version=" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ env.INSTALL_CANBOAT }}" != "1" ]; then
            echo "canboat_desc=none (wasm in-process)" >> "$GITHUB_OUTPUT"
            echo "canboat_sha=" >> "$GITHUB_OUTPUT"
          elif [ "${{ env.CANBOAT_SOURCE }}" = "git" ]; then
            cb_sha=$(gh api "repos/${{ env.CANBOAT_REPO }}/commits/${{ env.CANBOAT_REF }}" --jq .sha)
            composite="$composite canboat:${{ env.CANBOAT_REPO }}:${{ env.CANBOAT_REF }}:$cb_sha"
            echo "canboat_desc=git:${{ env.CANBOAT_REPO }}@${cb_sha:0:7}" >> "$GITHUB_OUTPUT"
            # The build consumes the SHA, not the branch name: a branch-name
            # build arg is identical across runs, so BuildKit would cache-hit
            # the compile layer and ship a stale binary after the branch moves.
            echo "canboat_sha=$cb_sha" >> "$GITHUB_OUTPUT"
          else
            echo "canboat_desc=v8.0.0-beta1" >> "$GITHUB_OUTPUT"
            echo "canboat_sha=" >> "$GITHUB_OUTPUT"
          fi
          echo "composite=$composite" >> "$GITHUB_OUTPUT"
          echo "master_sha=$MASTER_SHA" >> "$GITHUB_OUTPUT"
          echo "prs=${prs# }" >> "$GITHUB_OUTPUT"
          echo "branches=${branches# }" >> "$GITHUB_OUTPUT"
          echo "Composite key: $composite"

      - name: Compare to last-built state
        id: gate
        run: |
          set -euo pipefail
          LAST=$(cat state/last-dirkwa.txt 2>/dev/null || echo "")
          NEW="${{ steps.shas.outputs.composite }}"
          if [ "$LAST" = "$NEW" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "No change. Skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            [ "$LAST" = "$NEW" ] && echo "Stack unchanged, but force=true." || echo "Stack changed."
            echo "  was: $LAST"
            echo "  new: $NEW"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone master + merge PR stack
        if: steps.gate.outputs.changed == 'true'
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf signalk-src
          git clone https://github.com/${{ env.UPSTREAM }}.git signalk-src
          cd signalk-src
          git config user.email "build@dirkwa.local"
          git config user.name  "dirkwa build"
          git checkout master

          for pr in ${{ steps.shas.outputs.active_prs }}; do
            echo "::group::Merging PR #$pr"
            head_sha=$(gh api repos/${{ env.UPSTREAM }}/pulls/$pr --jq '.head.sha')
            git fetch origin "pull/$pr/head:pr-$pr"
            if ! git merge --no-ff --no-edit -m "Merge SignalK/signalk-server#$pr ($head_sha)" "pr-$pr"; then
              echo "::error::PR #$pr conflicts with the current stack on master."
              git merge --abort || true
              exit 1
            fi
            echo "::endgroup::"
          done

          # Merge the exact SHAs the state key was computed from, not the
          # mutable branch names: a push landing between the resolve step and
          # here would otherwise bake a commit into the image that neither
          # the state file nor the io.dirkwa.signalk.branches label records.
          composite="${{ steps.shas.outputs.composite }}"
          for spec in ${{ env.BRANCHES }}; do
            repo=${spec%%:*}; branch=${spec#*:}
            echo "::group::Merging $spec"
            head_sha=$(printf '%s\n' $composite | sed -n "s|^$spec:||p")
            if [ -z "$head_sha" ]; then
              echo "::error::$spec missing from the composite key." ; exit 1
            fi
            local_ref="branch-$(printf '%s' "$spec" | tr '/:' '--')"
            git fetch "https://github.com/$repo.git" "$branch:$local_ref"
            if ! git merge-base --is-ancestor "$head_sha" "$local_ref" 2>/dev/null \
               && [ "$(git rev-parse "$local_ref")" != "$head_sha" ]; then
              echo "::error::$spec no longer contains resolved head $head_sha (rewritten?)."
              exit 1
            fi
            if ! git merge --no-ff --no-edit -m "Merge $spec ($head_sha)" "$head_sha"; then
              echo "::error::Branch $spec conflicts with the current stack on master."
              git merge --abort || true
              exit 1
            fi
            echo "::endgroup::"
          done

          combined_sha=$(git rev-parse HEAD)
          echo "combined_sha=$combined_sha" >> "$GITHUB_OUTPUT"
          echo "combined_short=${combined_sha:0:7}" >> "$GITHUB_OUTPUT"

          # signalk-server version for the org.opencontainers.image.version
          # label. Best-effort: the updater's RuntimeIdentity resolver uses
          # the label as its backup answer when the live /signalk probe
          # can't reach the server; an empty label leaves the Dashboard
          # showing no version at all on such installs.
          version=$(jq -r '.version // empty' package.json || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "signalk-server version: ${version:-<none>}"

          # Remove .git so the artifact stays small and the build context
          # later doesn't hash a giant pack file.
          rm -rf .git

      - name: Pack unreleased n2k-signalk into extra-packages
        if: steps.gate.outputs.changed == 'true' && steps.shas.outputs.n2k_sha != ''
        run: |
          set -euo pipefail
          # Build the tarball here, where lifecycle scripts run: npm pack
          # triggers prepublishOnly (tsc build), so the tarball ships a
          # ready dist/ and installs cleanly under the image's
          # allow-scripts gate. Fetch the resolved SHA, not the branch
          # name — same staleness rule as the canboat build arg.
          rm -rf n2k-src
          git init -q n2k-src
          cd n2k-src
          git fetch -q --depth=1 "https://github.com/${{ env.N2K_SIGNALK_REPO }}.git" "${{ steps.shas.outputs.n2k_sha }}"
          git checkout -q FETCH_HEAD
          npm install
          npm pack
          mkdir -p ../signalk-src/extra-packages
          mv ./*.tgz ../signalk-src/extra-packages/
          ls -la ../signalk-src/extra-packages/

      - name: Pack combined Freeboard-SK into extra-packages
        if: steps.gate.outputs.changed == 'true' && steps.shas.outputs.freeboard_sha != ''
        run: |
          set -euo pipefail
          # npm pack runs Freeboard's prepack (build:all), so the tarball
          # ships the built webapp and helper plugin. Fetch the resolved SHA,
          # not the branch name - same staleness rule as n2k-signalk.
          rm -rf freeboard-src
          git init -q freeboard-src
          cd freeboard-src
          git fetch -q --depth=1 "https://github.com/${{ env.FREEBOARD_REPO }}.git" "${{ steps.shas.outputs.freeboard_sha }}"
          git checkout -q FETCH_HEAD
          npm install
          npm pack
          mkdir -p ../signalk-src/extra-packages
          mv ./*.tgz ../signalk-src/extra-packages/
          ls -la ../signalk-src/extra-packages/

      - name: Pack plugin PRs into extra-packages
        if: steps.gate.outputs.changed == 'true'
        id: plugins
        run: |
          set -euo pipefail
          # These plugins build in prepublishOnly, which npm pack does not
          # run, so build explicitly before packing.
          names=""
          for entry in ${{ steps.shas.outputs.plugin_prs }}; do
            repo=${entry%@*}; sha=${entry#*@}
            dir="plugin-src-$(basename "$repo")"
            rm -rf "$dir"
            git init -q "$dir"
            (
              cd "$dir"
              git fetch -q --depth=1 "https://github.com/$repo.git" "$sha"
              git checkout -q FETCH_HEAD
              npm install
              npm run build --if-present
              npm pack
              mkdir -p ../signalk-src/extra-packages
              mv ./*.tgz ../signalk-src/extra-packages/
            )
            names="$names $(jq -r .name "$dir/package.json")"
          done
          names=${names# }
          echo "bundle_plugins=$names" >> "$GITHUB_OUTPUT"
          disabled=$names
          if [ -n "${{ steps.shas.outputs.freeboard_sha }}" ]; then
            disabled="$disabled @signalk/freeboard-sk"
          fi
          disabled=$(echo $disabled | tr ' ' ',')
          echo "plugins_with_update_disabled=$disabled" >> "$GITHUB_OUTPUT"
          ls -la signalk-src/extra-packages/ 2>/dev/null || true

      - name: Upload prepared source as artifact
        if: steps.gate.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signalk-src
          path: signalk-src
          include-hidden-files: true
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_label: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_label: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore prepared source
        uses: actions/download-artifact@v8
        with:
          name: signalk-src
          path: signalk-src

      - name: Build single-arch image
        id: build
        uses: ./.github/actions/build-and-push-arch
        with:
          platform: ${{ matrix.platform }}
          source: local
          version: ${{ needs.prepare.outputs.version }}
          image: ${{ env.IMAGE }}
          upstream_sha: ${{ needs.prepare.outputs.combined_sha }}
          strip_packages: "@signalk/instrumentpanel"
          install_canboat: ${{ env.INSTALL_CANBOAT }}
          canboat_source: ${{ env.CANBOAT_SOURCE }}
          canboat_repo: ${{ env.CANBOAT_REPO }}
          canboat_ref: ${{ needs.prepare.outputs.canboat_sha || env.CANBOAT_REF }}
          canboat_wasm_version: ${{ needs.prepare.outputs.wasm_version }}
          bundle_plugins: ${{ needs.prepare.outputs.bundle_plugins }}
          plugins_with_update_disabled: ${{ needs.prepare.outputs.plugins_with_update_disabled }}
          extra_labels: |
            io.dirkwa.signalk.prs=${{ needs.prepare.outputs.prs }}
            io.dirkwa.signalk.branches=${{ needs.prepare.outputs.branches }}
            io.dirkwa.signalk.base-sha=${{ needs.prepare.outputs.master_sha }}
            io.dirkwa.canboat.version=${{ needs.prepare.outputs.canboat_desc }}
            io.dirkwa.n2k-signalk.version=${{ needs.prepare.outputs.n2k_desc }}
            io.dirkwa.canboat-wasm.version=${{ needs.prepare.outputs.wasm_desc }}
            io.dirkwa.freeboard.version=${{ needs.prepare.outputs.freeboard_desc }}
            io.dirkwa.plugin-prs=${{ needs.prepare.outputs.plugin_prs_desc }}

      - name: Stash digest for the merge job
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.arch_label }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch_label }}
          path: /tmp/digests/${{ matrix.arch_label }}
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: false

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          AMD_DIGEST=$(cat /tmp/digests/digest-amd64/amd64)
          ARM_DIGEST=$(cat /tmp/digests/digest-arm64/arm64)
          if [ -z "$AMD_DIGEST" ] || [ -z "$ARM_DIGEST" ]; then
            echo "Missing digests: amd64=$AMD_DIGEST arm64=$ARM_DIGEST" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:dirkwa \
            -t ${{ env.IMAGE }}:dirkwa-${{ needs.prepare.outputs.combined_short }} \
            ${{ env.IMAGE }}@${AMD_DIGEST} \
            ${{ env.IMAGE }}@${ARM_DIGEST}

      - name: Update state file
        run: |
          ./scripts/commit-state.sh \
            state/last-dirkwa.txt \
            "${{ needs.prepare.outputs.composite }}" \
            "chore(state): dirkwa ${{ needs.prepare.outputs.combined_short }} [skip ci]"
