name: Build and push (single architecture, digest-only)
description: >
  Build the signalk-server image for a single platform on a native runner
  and push by digest only (no tag). The caller is expected to assemble a
  manifest list across architectures in a follow-up job.

inputs:
  platform:
    description: "Target buildx platform, e.g. linux/amd64 or linux/arm64."
    required: true
  source:
    description: "SIGNALK_SOURCE build arg: npm | git | local."
    required: true
  version:
    description: >-
      signalk-server version string. Consumed as the SIGNALK_VERSION build
      arg when source=npm, and always stamped into the
      org.opencontainers.image.version label — the updater's
      RuntimeIdentity resolver reads that label as its backup answer when
      the live /signalk probe can't reach the server, so git/local builds
      should pass the resolved upstream version too.
    required: false
    default: ""
  git_ref:
    description: "Git ref (when source=git)."
    required: false
    default: ""
  image:
    description: "Image repository (no tag), e.g. ghcr.io/owner/signalk-server."
    required: true
  upstream_sha:
    description: "Upstream signalk-server commit SHA for image label."
    required: false
    default: ""
  strip_packages:
    description: >-
      Space-separated npm package names removed from the installed tree at
      the end of the install stage (STRIP_PACKAGES build arg), e.g.
      "@signalk/instrumentpanel". Empty keeps everything.
    required: false
    default: ""
  extra_labels:
    description: >-
      Additional newline-separated label lines appended verbatim to the
      standard OCI label set, e.g. "io.dirkwa.signalk.prs=2588:ab12cd3".
      Empty keeps the standard labels only.
    required: false
    default: ""
  install_canboat:
    description: >-
      "1" installs canboat's prebuilt C tools (INSTALL_CANBOAT build arg),
      activating signalk-server's native N2K decode option in the admin UI.
      Default "0" keeps variants mirroring upstream behaviour.
    required: false
    default: "0"
  canboat_source:
    description: >-
      "release" (default) installs the sha256-pinned prebuilt tools;
      "git" builds the Rust canboat binary from canboat_repo@canboat_ref
      instead (argv[0] shims + `canboat convert`). Only meaningful with
      install_canboat: "1".
    required: false
    default: "release"
  canboat_repo:
    description: "owner/repo to build canboat from when canboat_source=git."
    required: false
    default: "canboat/canboat"
  canboat_ref:
    description: "Git ref to build canboat from when canboat_source=git."
    required: false
    default: "master"
  canboat_wasm_version:
    description: >-
      Published @canboat/wasm version to install into the image (e.g.
      "8.0.0"). Empty (default) installs nothing.
    required: false
    default: ""

outputs:
  digest:
    description: "The single-arch manifest digest just pushed to GHCR."
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ inputs.platform }}
        push: true
        provenance: true
        sbom: true
        cache-from: type=gha,scope=${{ inputs.platform }}
        cache-to: type=gha,mode=max,scope=${{ inputs.platform }}
        build-args: |
          SIGNALK_SOURCE=${{ inputs.source }}
          SIGNALK_VERSION=${{ inputs.version }}
          SIGNALK_GIT_REF=${{ inputs.git_ref }}
          STRIP_PACKAGES=${{ inputs.strip_packages }}
          INSTALL_CANBOAT=${{ inputs.install_canboat }}
          CANBOAT_SOURCE=${{ inputs.canboat_source }}
          CANBOAT_REPO=${{ inputs.canboat_repo }}
          CANBOAT_REF=${{ inputs.canboat_ref }}
          CANBOAT_WASM_VERSION=${{ inputs.canboat_wasm_version }}
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ inputs.upstream_sha }}
          org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          org.opencontainers.image.title=signalk-server
          org.opencontainers.image.licenses=LicenseRef-Source-Available-No-Redistribution
          org.opencontainers.image.description=Unofficial SignalK server Docker image (Ubuntu 26.04 + Node 24 + podman/docker-cli)
          ${{ inputs.extra_labels }}
