services:
  signalk-server:
    image: ghcr.io/dirkwa/signalk-server:latest
    container_name: signalk-server
    restart: unless-stopped
    # Host networking is the easiest path for mDNS advertisement
    # (pure-JS @astronautlabs/mdns inside the server uses raw UDP multicast).
    network_mode: host
    # Bridge alternative — pick this OR network_mode: host, not both.
    # ports:
    #   - "3000:3000"

    # USB serial / I2C / SPI access for plugins
    privileged: true
    devices:
      - /dev:/dev

    # environment:
    #   # Optional: Node-RED Victron nodes (node-red-contrib-victron) talking to a
    #   # REMOTE GX device (Cerbo/Venus) over Insecure D-Bus/TCP. Plain host:port,
    #   # no tcp:host= prefix. Requires /Settings/Services/InsecureDbusOverTcp = 1
    #   # on the GX device, followed by a reboot of that device.
    #   #
    #   # WARNING: Insecure D-Bus over TCP is unauthenticated and unencrypted.
    #   # Anyone who can reach port 78 gets full control of the GX device. Use it
    #   # only on a trusted network, firewall port 78 to this host, and never
    #   # expose it to the Internet -- use a VPN for remote access.
    #   #
    #   # Note this is the compose form. The equivalent docker run flag is
    #   #   -e NODE_RED_DBUS_ADDRESS=192.168.1.4:78
    #   # The -e belongs to docker run only -- do not carry it into the list below,
    #   # or the variable ends up literally named "-e NODE_RED_DBUS_ADDRESS" and is
    #   # silently ignored.
    #   - NODE_RED_DBUS_ADDRESS=192.168.1.4:78
    #
    #   # Do NOT set DBUS_SYSTEM_BUS_ADDRESS globally: it points the whole server
    #   # at one bus, and has been seen to break the core with .dbus-keyrings errors.

    volumes:
      - ./signalk-data:/home/node/.signalk

      # Optional: container-orchestration plugins (signalk-container,
      # signalk-questdb, signalk-grafana) talk to the host runtime via
      # a bind-mounted socket. Pick whichever your host runs.
      #
      # Docker host:
      # - /var/run/docker.sock:/var/run/docker.sock
      #
      # Podman host (rootless):
      # - /run/user/1000/podman/podman.sock:/var/run/docker.sock

      # Optional: BLE plugin support (mount host D-Bus)
      # - /run/dbus:/run/dbus:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
